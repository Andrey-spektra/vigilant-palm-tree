<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<div id="app"></div>
<button onclick="run('CANVAS','on')">CANVAS crossOrigin on</button>
<button onclick="run('CANVAS','off')">CANVAS crossOrigin default</button>
<button onclick="run('WEBGL','on')">WEBGL crossOrigin on</button>
<button onclick="run('WEBGL','off')">WEBGL crossOrigin default</button>
<div id="res"></div>
<script src="http://localhost:8800/node_modules/phaser/dist/phaser.min.js"></script>
<script>
function run(rtype, co) {
  document.getElementById('app').innerHTML='';
  const holder=document.createElement('div'); document.getElementById('app').appendChild(holder);
  const png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
  const loader = co==='on' ? { crossOrigin:'anonymous' } : {};
  const cfg={type:rtype==='WEBGL'?Phaser.WEBGL:Phaser.CANVAS,width:50,height:20,parent:holder,loader:loader,
    scene:{preload(){this.load.image('tc',png);this.load.on('fileerror',f=>res.innerHTML+='FILEERR '+f.key+'<br>');this.load.on('loaderror',(f)=>{res.innerHTML+='LOADERR '+f.key+' '+f.src+'<br>';});},create(){res.innerHTML+='CREATED r='+rtype+' co='+co+' tex='+this.textures.exists('tc')+'<br>';}}};
  new Phaser.Game(cfg);
}
</script>
</body></html>
